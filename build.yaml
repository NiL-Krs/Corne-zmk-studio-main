
---
include:
  # Левая половина — основная прошивка с ZMK Studio
  - board: nice_nano//zmk
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  # Правая половина
  - board: nice_nano//zmk
    shield: corne_right

  # Сброс настроек
  - board: nice_nano//zmk
    shield: settings_reset

  # Левая половина — диагностическая прошивка
  - board: nice_nano//zmk
    shield: corne_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=n
    artifact-name: corne_left_debug
